# Render Blueprint — deploys both services from this one repo.
# https://render.com/docs/blueprint-spec
#
# Usage: on Render, "New +" -> "Blueprint", point it at this repo. It will
# create both services below. Set GEMINI_API_KEY on vasooli-api afterwards
# (marked sync: false so it isn't stored in this file) — see server/.env.example.
# Once vasooli-api has a live URL, set VITE_API_BASE on vasooli-client to it
# and trigger a redeploy of the client (it's baked in at build time).

services:
  - type: web
    name: vasooli-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: NODE_VERSION
        value: 20.0.0

  - type: web
    name: vasooli-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Point this at vasooli-api's live URL once it's deployed, e.g.
      # https://vasooli-api.onrender.com — then redeploy this service.
      - key: VITE_API_BASE
        value: https://vasooli-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
